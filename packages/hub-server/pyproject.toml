[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "python-hub-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.40,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "zstandard>=0.23,<1",
  "argon2-cffi>=23.1,<24",
  "docker>=7.1,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hub_server"]
