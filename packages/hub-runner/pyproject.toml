[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "python-hub-runner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "python-hub-contracts==0.1.0",
  "python-hub-sdk==0.1.0",
  "docker>=7,<8",
  "zstandard>=0.23,<1",
]

[project.scripts]
hub-runner = "hub_runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_runner"]
