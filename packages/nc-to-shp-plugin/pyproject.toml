[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "nc-to-shp-plugin"
version = "1.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "GDAL==3.10.3",
  "h5py==3.12.1",
  "numpy==2.1.3",
  "python-hub-sdk==0.1.0",
  "scipy==1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nc_to_shp_plugin"]
