worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # 插件 .pypkg 与大型输入文件经浏览器上传
    client_max_body_size 10g;

    proxy_connect_timeout 60s;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 本容器只经 127.0.0.1 端口发布，能连进来的一定是宿主机或 Docker 网络内的反向代理。
        # 信任这些来源重写的 X-Forwarded-For，把 $remote_addr 还原成真实客户端；否则
        # $proxy_add_x_forwarded_for 追加的是 Docker 网关地址，hub-api 取最右侧条目时
        # 拿到的永远是网关，审计取证与登录限流都会丢掉真实来源。
        # real_ip_recursive 由右向左跳过可信地址取第一个不可信条目，客户端伪造的前导条目无效。
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location = /web-health {
            access_log off;
            return 200 "ok\n";
        }

        # 内部协议端口禁止经 Web 边界访问
        location /internal/v1/ {
            return 404;
        }

        location /api/v1/ {
            proxy_pass http://service-hub:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 下载大文件时关闭缓冲，避免 Nginx 落盘
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
