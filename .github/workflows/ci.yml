name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read
  issues: write

jobs:
  # ---------------------------------------------------------------- secrets
  # Fast gate that stops credentials from ever reaching the remote.
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan tracked files for credentials
        run: python deploy/ci/check_secrets.py --fail-on error

  # ---------------------------------------------------------------- backend
  backend:
    name: Backend gate
    # Run inside the exact base image the deployment uses: the suite passed in
    # a python:3.12-slim/bookworm container on the deployment host but failed on
    # the bare ubuntu runner, and the container is the environment that matters.
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Mark the workspace as a safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install workspace and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/hub-contracts \
                      -e ./packages/hub-sdk \
                      -e ./packages/hub-runner \
                      -e ./packages/hub-server \
                      -e ./packages/hub-publisher
          pip install "pytest>=8.3,<9" "pytest-cov>=5,<6" "ruff>=0.6,<1" \
                      "mypy>=1.11,<1.20" "types-PyYAML>=6.0,<7" "httpx>=0.27,<1"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        run: |
          rc=0
          python -m pytest -q --tb=line -rf | tee /tmp/pytest.log || rc=$?
          echo "pytest_exit=$rc" >> /tmp/pytest.log
          exit $rc
      - name: Dump pytest tail into an issue (anonymous-diagnosis channel)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json; body = open('/tmp/pytest.log', encoding='utf-8', errors='replace').read()[-60000:]; open('/tmp/issue-body.json', 'w', encoding='utf-8').write(json.dumps({'title': 'CI pytest failure ' + __import__('os').environ['GITHUB_SHA'][:7], 'body': body}))"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" --data @/tmp/issue-body.json "https://api.github.com/repos/$GITHUB_REPOSITORY/issues"
  # ---------------------------------------------------------------- web
  web:
    name: Web console gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm run test:run
        env:
          CI: "true"
      - name: build
        run: npm run build

  # ---------------------------------------------------------------- images
  # Proves the Dockerfile still builds. Runs only on main / PR to main and
  # uses the GitHub Actions cache so a warm run costs ~1 minute.
  image-build:
    name: Main image builds
    runs-on: ubuntu-latest
    needs: [secrets-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: service-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
