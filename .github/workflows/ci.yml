name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- secrets
  # Fast gate that stops credentials from ever reaching the remote.
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan tracked files for credentials
        run: python deploy/ci/check_secrets.py --fail-on error

  # ---------------------------------------------------------------- backend
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install workspace and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/hub-contracts \
                      -e ./packages/hub-sdk \
                      -e ./packages/hub-runner \
                      -e ./packages/hub-server \
                      -e ./packages/hub-publisher
          pip install "pytest>=8.3,<9" "pytest-cov>=5,<6" "ruff>=0.6,<1" \
                      "mypy>=1.11,<1.20" "types-PyYAML>=6.0,<7" "httpx>=0.27,<1"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        run: |
          python -m pytest -q | tee /tmp/pytest.log; exit ${PIPESTATUS[0]}
      - name: Annotate failing tests (publicly readable via the checks API)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name=="Backend gate") | .id')
          grep "^FAILED " /tmp/pytest.log | head -50 | jq -R '{path: ".github", start_line: 1, end_line: 1, annotation_level: "failure", title: (.["0:" + .][0:60]), message: ("pytest failed: " + .)}' | jq -s '{annotations: .}' > /tmp/annotations.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs/$ID/annotations" --input /tmp/annotations.json
          grep -c "^FAILED " /tmp/pytest.log || true
