name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- secrets
  # Fast gate that stops credentials from ever reaching the remote.
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan tracked files for credentials
        run: python deploy/ci/check_secrets.py --fail-on error

  # ---------------------------------------------------------------- backend
  backend:
    name: Backend gate
    # Run inside the exact base image the deployment uses: the suite passed in
    # a python:3.12-slim/bookworm container on the deployment host but failed on
    # the bare ubuntu runner, and the container is the environment that matters.
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install workspace and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/hub-contracts \
                      -e ./packages/hub-sdk \
                      -e ./packages/hub-runner \
                      -e ./packages/hub-server \
                      -e ./packages/hub-publisher
          pip install "pytest>=8.3,<9" "pytest-cov>=5,<6" "ruff>=0.6,<1" \
                      "mypy>=1.11,<1.20" "types-PyYAML>=6.0,<7" "httpx>=0.27,<1"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        run: |
          python -m pytest -q | tee /tmp/pytest.log; exit ${PIPESTATUS[0]}
      - name: Annotate failing tests (publicly readable via the checks API)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, urllib.request, os
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          hdr = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'}
          req = urllib.request.Request('https://api.github.com/repos/' + repo + '/commits/' + sha + '/check-runs', headers=hdr)
          runs = json.load(urllib.request.urlopen(req))['check_runs']
          cid = [r['id'] for r in runs if r['name'] == 'Backend gate'][0]
          failed = [l.split()[1] for l in open('/tmp/pytest.log', encoding='utf-8', errors='replace') if l.startswith('FAILED ')]
          ann = [{'path': '.github', 'start_line': 1, 'end_line': 1, 'annotation_level': 'failure',
                  'title': n[:60], 'message': ('pytest failed: ' + n)[:250]} for n in failed[:50]]
          body = json.dumps({'annotations': ann}).encode()
          req = urllib.request.Request('https://api.github.com/repos/' + repo + '/check-runs/' + str(cid) + '/annotations', data=body, method='POST', headers=hdr)
          urllib.request.urlopen(req)
          PY
