[unix_http_server]
file=/run/service-hub/supervisor.sock
chmod=0700

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/service-hub/supervisord.pid
childlogdir=/run/service-hub
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/service-hub/supervisor.sock

[program:hub-api]
command=python -m deploy.service_hub.log_prefix hub-api -- uvicorn hub_server.main:app --host 0.0.0.0 --port 8000
directory=/app
user=hub-api
umask=0002
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=65
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:conda-runner]
command=python -m deploy.service_hub.log_prefix conda-runner -- python -m deploy.runner.conda_runner_service
directory=/app
user=conda-runner
umask=0002
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=65
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:docker-runner]
command=python -m deploy.service_hub.log_prefix docker-runner -- python -m deploy.runner.docker_runner_service
directory=/app
user=docker-runner
umask=0002
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=65
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cleaner]
command=python -m deploy.service_hub.log_prefix cleaner -- python -m deploy.service_hub.cleaner_service
directory=/app
user=hub-api
umask=0002
autorestart=true
stopasgroup=true
